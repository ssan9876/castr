# Wi-Fi Direct only: no station networks, no auto-connect. The sink owns this
# supplicant instance and drives it over the control socket below, so it does
# not disturb whatever the system supplicant is doing on the same radio.
# GROUP=castr so the receiver, which runs unprivileged, can open the socket.
ctrl_interface=DIR=/run/wpa_supplicant_castr GROUP=castr
update_config=0
device_name=castr
# 7-0050F204-1: a display device, which is what a Miracast sink must claim.
device_type=7-0050F204-1
# The PIN is shown on the television and typed on the PC, so we advertise the
# display method only.
config_methods=display
# 15 means always be the group owner: the Pi has the screen, so it must be.
p2p_go_intent=15
p2p_go_ht40=1
# As group owner we are the access point, and the default AP behaviour is to
# deauthenticate a client whose acknowledgements start failing. That is exactly
# what a shared Wi-Fi/Bluetooth antenna looks like from this side: acks stop for
# under a second and we throw the PC off a working cast.
disassoc_low_ack=0
# A paused cast is not a departed peer. (ap_max_inactivity is a per-network
# field the parser rejects at global scope; p2p_go_max_inactivity is the
# global knob that feeds it into the GO's auto-created network block.)
p2p_go_max_inactivity=300
# The group owner does not go quiet on a power-save schedule. The Pi is
# mains-powered, and a client that misses the window sees a stalled link.
p2p_go_ctwindow=0
